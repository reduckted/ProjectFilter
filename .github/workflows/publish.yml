name: Publish Extension

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: windows-2022

    env:
      Configuration: Release
      DeployExtension: false

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup MSBuild
        uses: actions/setup-dotnet@v5

      - name: Publish
        working-directory: source/ProjectFilter
        run: dotnet msbuild -target:PublishToMarketplace -property:BuildBeforePublish=true -property:PersonalAccessToken=${{ secrets.PUBLISHER_TOKEN }}
