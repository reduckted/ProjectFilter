name: Publish Extension

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: windows-2025-vs2026

    env:
      Configuration: Release
      DeployExtension: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Publish
        working-directory: source/ProjectFilter
        run: |
          dotnet restore
          dotnet msbuild -target:PublishToMarketplace -property:BuildBeforePublish=true -property:PersonalAccessToken=${{ secrets.PUBLISHER_TOKEN }}
